<main class="portfolio-page">
  <ng-container *ngIf="content$ | async as content; else loading">
    <!-- Portfolio Hero -->
    <section class="portfolio-hero" style="background-image: url('assets/portfolio/portfolio-hero.png');">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <span class="hero-badge">{{ content.hero.badge }}</span>
        <h1 class="page-title">{{ content.hero.title }}</h1>
        <div class="breadcrumbs">
          <a routerLink="/">Home</a>
          <i class="fas fa-chevron-right"></i>
          <span>Portfolio</span>
        </div>
      </div>
    </section>

    <!-- Portfolio Filter & Grid -->
    <section class="portfolio-content">
      <div class="container">
        <div class="filter-controls">
          <button *ngFor="let filter of content.filters" 
                  (click)="setFilter(filter.id)" 
                  [class.active]="currentFilter === filter.id">
            {{ filter.label }}
          </button>
        </div>

      <ng-container *ngIf="global$ | async as global">
        <div class="portfolio-grid">
          <div class="project-card" *ngFor="let project of getFilteredProjects(content.projects)">
            <div class="project-image" [class.phone-frame]="project.hasFrame">
              <div class="frame-container" *ngIf="project.hasFrame">
                <div class="phone-notch"></div>
                <img [src]="project.image" [alt]="project.title">
              </div>
              <img *ngIf="!project.hasFrame" [src]="project.image" [alt]="project.title">
              <div class="project-overlay">
                <div class="overlay-content">
                  <div class="tags">
                    <span class="tag" *ngFor="let tag of project.tags">{{tag}}</span>
                  </div>
                  <h3>{{project.title}}</h3>
                  <p>{{project.description}}</p>
                  <a [routerLink]="['/portfolio', project.id]" class="view-project">
                    {{ global.portfolio.viewCaseStudyBtn }} <i class="fas fa-arrow-right"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
      </div>
    </section>

    <!-- Portfolio CTA -->
    <section class="portfolio-cta">
      <div class="container">
        <div class="cta-card">
          <div class="cta-info">
            <h2>{{ content.cta.title }}</h2>
            <p>{{ content.cta.desc }}</p>
          </div>
          <div class="cta-btn">
            <a routerLink="/contact" class="btn-primary-gradient">{{ content.cta.button }}</a>
          </div>
        </div>
      </div>
    </section>
  </ng-container>

  <ng-template #loading>
    <div class="skeleton" style="height: 350px; width: 100%; border-radius: 0;"></div>
    <div style="padding: 60px 5%; display: flex; justify-content: center; gap: 20px;">
      <div class="skeleton" style="height: 40px; width: 120px; border-radius: 20px;"></div>
      <div class="skeleton" style="height: 40px; width: 150px; border-radius: 20px;"></div>
      <div class="skeleton" style="height: 40px; width: 150px; border-radius: 20px;"></div>
    </div>
    
    <div style="padding: 0 5% 80px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
      <div class="skeleton skeleton-card" *ngFor="let i of [1,2,3,4,5,6]" style="height: 350px; border-radius: 12px; background: #e2e8f0;"></div>
    </div>
  </ng-template>
</main>
