<div class="navbar-container">
  <nav class="navbar-wrapper">
    <a routerLink="/" class="navbar-brand">
      <div class="logo-icon">
        <img src="mainlogo2.png" alt="Facify Logo" class="brand-img">
      </div>
      <div class="logo-text">
        <span class="brand-name">FACIFY</span>
        <span class="brand-sub">WEB & APP DEVELOPMENT</span>
      </div>
    </a>

    <ul class="nav-links" [class.mobile-open]="isMenuOpen">
      <li class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <a routerLink="/" (click)="closeMenu()">Home</a>
      </li>
      <li class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <a routerLink="/about" (click)="closeMenu()">About</a>
      </li>
      <li class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <a routerLink="/services" (click)="closeMenu()">Services</a>
      </li>
      <li class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <a routerLink="/portfolio" (click)="closeMenu()">Portfolio</a>
      </li>
      <li class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <a routerLink="/contact" (click)="closeMenu()">Contact</a>
      </li>
      <li class="nav-item mobile-only">
        <a routerLink="/contact" class="btn-cta-mobile" (click)="closeMenu()">Free Consultation</a>
      </li>
    </ul>

    <div class="navbar-actions desktop-only">
      <a routerLink="/contact" class="btn-cta">Free Consultation</a>
    </div>

    <button class="mobile-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen" aria-label="Toggle Navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>
</div>
